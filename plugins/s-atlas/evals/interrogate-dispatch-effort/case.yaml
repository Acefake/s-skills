schema_version: "1.1"
name: interrogate-dispatch-effort
description: 角色行带（档位）时，派审查者的 model 必须是干净的别名，effort 带上档位。
tags: [dispatch, interrogate]
runs: 1
execution:
  max_turns: 30
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Agent]
  append_system_prompt: |
    以下是用户的个人规则文件 ~/.claude/rules/s-models.md 的内容：

    # s 模型配置
    # 一行一个角色。删掉一行就用技能默认。
    # inherit-parent 或 auto：跟父对话的模型，派子代理时不传模型。
    # 逗号分隔的列表，每一项派一个子代理。
    # 预算: 中（high）
    审问审查者: sonnet（medium）, opus（high）
    # s 模型配置结束
  prompt: |
    /s-atlas:interrogate 审一下下面这段 Python，不用读文件，代码就在这里：

    ```python
    def add(a, b):
        """Return the sum of a and b."""
        return a - b
    ```
