name: check-marketplace

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install JSON Schema checker
        run: pip install "jsonschema>=4.20"
      - name: Check marketplace manifests and versions
        run: python3 scripts/check_marketplace.py
